<section class="content-section popular-section" aria-labelledby="populares-title">
		<h2 id="populares-title">{{ paginaPromocoes ? 'Ofertas imperdíveis' : 'Produtos populares' }}</h2>
		<div class="product-grid">
			@for (produto of produtosExibidos; track produto.nome) {
				<article class="product-card">
					<a class="offer-tag" routerLink="/promocoes">Oferta imperdível!</a>
					<img [src]="produto.imagem" [alt]="produto.nome" />
					<div class="product-info">
						<p>{{ produto.categoria }}</p>
						<h3>{{ produto.nome }}</h3>
						<s class="original-price">{{ produto.precoOriginal }}</s>
						<strong>{{ produto.preco }}</strong>
					</div>
					<!-- <button class="add-to-cart-button" type="button" (click)="adicionarAoCarrinho(produto)">
						<span aria-hidden="true">&#128722;</span>
						<span class="sr-only">Adicionar {{ produto.nome }} ao carrinho</span>
					</button> -->
				</article>
			} @empty {
				<p class="empty-state">Nenhum produto encontrado.</p>
			}
		</div>
		<!-- @if (produtosExibidos.length < produtosFiltrados.length) {
			<button class="show-more-button" type="button" (click)="verMais()">
				Ver mais produtos <span aria-hidden="true">+</span>
			</button>
		} -->
	</section>
