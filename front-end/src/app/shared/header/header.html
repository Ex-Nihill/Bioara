
<mat-toolbar color="Secundary">
  <img src="logo.png" alt="logo" class="logo" />
  <div>
    <button matButton routerLink="">Inicio</button>
    <button matButton routerLink="/produtos">Produtos</button>
    <button matButton routerLink="/sobre-nos">Sobre nós</button>
  </div>
  <div>
    @if (getUsuarioLogado(); as usuario) {
      <button matButton routerLink="/conta"> <i class="fa-regular fa-user"></i></button>
      <button matButton routerLink="/favoritos" aria-label="Favoritos">♡ Favoritos</button>
      <button matButton routerLink="/minhas-compras">Minhas compras</button>
    } @else {
      <button matButton routerLink="/login">Login</button>
    }
    <button matButton routerLink="/carrinho">
      <img class="carrinho" src="/carrinho.png" alt="" />
    </button>
  </div>
</mat-toolbar>
